# ── 简繁切换（改这一行就能切，重启游戏生效）──────────────────
# lang=simp  简体（本包默认）
# lang=trad  繁体
# 也接受 lang=chs/cht、lang=hans/hant、lang=simplified/traditional、lang=1/0。
# 旧写法 chslang=1 / chslang=0 仍然兼容，同时存在时以 lang= 为准。
# 只切换字形池，不换任何资源文件 —— 不用重装，改完存盘、下次启动就读到了。
lang=simp

# ── 定向配色：只把该 build 真正的灰阶过场字白化，其余信任游戏自然色 ──
# 格式: fontcolor=RVA十六进制:white（运行时自动取最亮）
# GOG 2.10E 与 STEAM 2.10F 的字体 RVA 不重叠，各自只命中自己那一行。
fontcolor=28774C:white;28873C:white
fontcolor=28776C:white
fontcolor=28875C:white

# ── 常规开关 ──────────────────────────────────────────────
# debug=1 打开诊断日志（写 update\sk2_zh.log）；出问题时不要关，方便排查。
debug=1
# oem=1 把引擎的 OEM→Latin1 变换恒等化，资源统一按原始 Big5 解释。
oem=1
# 自绘路径开关，出问题时才需要逐个关掉做二分定位：
# draw=0 关中文自绘 / puta=0 / wrap=0 / para=0 / hyp=0
draw=1
puta=1
para=1
wrap=1
hyp=1
perf=1

# ── 应急开关（怀疑是汉化导致卡死时用）──────────────────────
# 把下面这行开头的 # 删掉，重启游戏：插件立刻停止全部自绘与诊断，
# 画面回到英文原版，只剩一个 bool 判断的开销。用来确认「卡死是否与汉化有关」。
# safe = 1

# ── fontcolor 的 RVA 说明（改这两行之前先读）──────────────
#   GOG   2.10E：28774C = 过场标题(24px)；28873C = 工人/忠诚度面板字(16px)
#   STEAM 2.10F：28776C = 过场诗句(24px)；28875C = 工人/忠诚度面板字(16px)
#                ↑ 对应 GOG 的 28873C（+0x20）
#   面板字由 Font::put 绘制，走 FontColors→FontColorFor，所以 fontcolor= 对它生效。
#   其余字一律不动。以后任何界面还有看不清的字，单独补一条 "RVA:white" 即可。
#   注意：换 exe 版本后 RVA 会变，这一行就要重新测；签名挂钩不受影响。
